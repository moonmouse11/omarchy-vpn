name: SonarQube

on:
  # Not dev: SonarQube Cloud's free plan analyses only the main branch and
  # pull requests ("Organization is not allowed to access data from non main
  # branches" failed every push to dev). PRs into dev are analysed.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  sonar:

    # The scan step is skipped until SONAR_TOKEN is set in the repository
    # secrets (a fresh repo has none); tests with coverage still run.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # Pinned, not "ubuntu-latest": GitHub is migrating that label from
    # 24.04 to 26.04 starting 2026-10-19.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history enables blame information and new-code detection.
        fetch-depth: 0

    - name: Setup uv + Python
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.23"
        python-version: "3.14"
        activate-environment: true
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      # exact versions and hashes from uv.lock; wheels only, nothing is built
      run: uv sync --locked --no-build

    - name: Run tests with coverage
      # coverage.py writes <source>.../src</source> plus filenames relative
      # to it (e.g. "config.py") — sonar-python's Cobertura sensor resolves
      # filenames against that <source> tag itself, so this needs no path
      # rewrite (unlike a Clover/PHP report, which has no <source> and is
      # matched against the project root instead — a prior "fix" here
      # applied that rewrite anyway, which made every path unresolvable
      # and silently zeroed out coverage on SonarCloud).
      run: pytest --cov=src --cov-report=xml

    - name: Run SonarQube analysis
      if: env.SONAR_TOKEN != ''
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        # Not a secret: the public SonarCloud endpoint.
        SONAR_HOST_URL: https://sonarcloud.io
