name: Python

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  tests:

    # Pinned, not "ubuntu-latest": GitHub is migrating that label from
    # 24.04 to 26.04 starting 2026-10-19. Python 3.14 only: what Arch (and so
    # Omarchy 4, the only target) ships.
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: [ "3.14" ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Lint (ruff)
      run: ruff check src tests

    - name: Format (ruff)
      run: ruff format --check src tests

    - name: Type check (mypy)
      run: mypy src

    - name: Run test suite
      run: pytest
