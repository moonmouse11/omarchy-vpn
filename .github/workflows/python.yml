name: Python

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  tests:

    # Pinned, not "ubuntu-latest": GitHub is migrating that label from
    # 24.04 to 26.04 starting 2026-10-19. Python 3.14 only: what Arch (and so
    # Omarchy 4, the only target) ships.
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: [ "3.14" ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup uv + Python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.12.23"
        python-version: ${{ matrix.python-version }}
        activate-environment: true
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      # exact versions and hashes from uv.lock; wheels only, nothing is built
      run: uv sync --locked --no-build

    - name: Lint (ruff)
      run: ruff check src tests

    - name: Format (ruff)
      run: ruff format --check src tests

    - name: Type check (mypy)
      run: mypy src

    - name: Shell scripts (shellcheck)
      # preinstalled on the runner; the root helper and kill switch are bash
      run: >
        shellcheck --severity=warning install.sh uninstall.sh
        scripts/happ-killswitch scripts/omarchy-vpn-helper scripts/openvpn-dns-updown

    - name: Run test suite
      run: pytest
