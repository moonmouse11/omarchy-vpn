# SonarQube / SonarCloud project configuration.
# Secrets (SONAR_TOKEN, SONAR_HOST_URL) live in the GitHub repository settings.

sonar.projectKey=moonmouse11_omarchy-vpn
sonar.organization=moonmouse11

# not only src: the root helper, the kill switch, the installers, CI and the
# test image are attack surface too (Automatic Analysis scanned all of them)
sonar.sources=src,scripts,install.sh,uninstall.sh,Dockerfile.test,pyproject.toml,.github
sonar.tests=tests
# what Arch / Omarchy 4 ships (requires-python) — Sonar otherwise assumes
# every Python 3 version and warns on syntax like PEP 758's `except A, B:`
sonar.python.version=3.14

# coverage.xml produced by pytest-cov in CI; its <source> tag resolves the
# paths, no rewrite (see .github/workflows/sonar.yml).
sonar.python.coverage.reportPaths=coverage.xml

# Fail the build when the Quality Gate fails.
sonar.qualitygate.wait=true

sonar.sourceEncoding=UTF-8
